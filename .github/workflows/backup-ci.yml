name: backup-ci

# CI for the aws-backup-dr Terraform stack and its Lambda functions.
# Three independent jobs run in parallel (Terraform static analysis, IaC
# security scanning, and Python unit tests); a final gate job summarises the
# result so branch protection can require a single check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  CHECKOV_VERSION: "3.2.257"

jobs:
  # ---------------------------------------------------------------------------
  # Terraform: formatting, validation, and lint
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Cache tflint plugins
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ env.TFLINT_VERSION }}-${{ hashFiles('terraform/.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987 # v4.0.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run TFLint
        run: |
          tflint --init
          tflint --format compact

  # ---------------------------------------------------------------------------
  # Checkov: infrastructure-as-code security scanning
  # ---------------------------------------------------------------------------
  checkov:
    name: checkov-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Run Checkov on Terraform
        run: |
          checkov \
            --directory terraform \
            --framework terraform \
            --quiet \
            --compact \
            --soft-fail-on LOW

  # ---------------------------------------------------------------------------
  # Python: unit tests for the Lambda functions
  # ---------------------------------------------------------------------------
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Gate: a single required check that depends on the others
  # ---------------------------------------------------------------------------
  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    needs: [terraform, checkov, python-tests]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.terraform.result }}" != "success" ] || \
             [ "${{ needs.checkov.result }}" != "success" ] || \
             [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
